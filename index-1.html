<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orderify</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1f4d3a;--gd:#143526;--cream:#faf6ee;--gold:#c9a24b}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--cream);color:#2b2b2b;padding-bottom:84px}
header{background:linear-gradient(160deg,var(--gd),var(--g));color:#fff;padding:20px 16px 18px;text-align:center;border-radius:0 0 26px 26px;border-bottom:3px solid var(--gold)}
h1{margin:0;font-family:'Great Vibes','Brush Script MT',cursive;font-size:40px;font-weight:400;color:#f0d488}
header small{display:block;letter-spacing:2px;font-size:10px;text-transform:uppercase;opacity:.85}
h2{margin:18px 16px 6px;font-size:14px;color:#9a7b2f;text-transform:uppercase;letter-spacing:1.5px;scroll-margin-top:60px}
.it,.card{background:#fff;margin:8px 12px;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card{display:block}.off{opacity:.5}.q{display:flex;align-items:center;gap:8px}
button{background:var(--g);color:#fff;border:0;border-radius:20px;padding:8px 16px;font:500 14px Poppins,sans-serif}
.q button{padding:2px 12px;font-size:18px}button.g{background:#efe8d6;color:#3a3324}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px;background:#fffdf7;box-shadow:0 -2px 8px rgba(0,0,0,.08)}#bar button{width:100%;padding:14px;font-size:16px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}.p{padding:12px}
.tabs{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;background:var(--cream);z-index:5}
.chips a{white-space:nowrap;background:#fff;border:1px solid #e3d3a3;color:var(--gd);padding:6px 14px;border-radius:20px;font-size:13px;text-decoration:none}
.v{display:inline-block;width:12px;height:12px;border:1.5px solid #2e8b3f;border-radius:3px;margin-right:6px;position:relative;vertical-align:middle}.v:after{content:'';position:absolute;inset:2px;border-radius:50%;background:#2e8b3f}
.mh{display:flex;justify-content:space-between;align-items:center;margin-right:12px}.mh button{padding:4px 10px;font-size:13px}
#pop{position:fixed;top:0;left:0;right:0;z-index:99;background:#e67e22;color:#fff;padding:18px 16px;text-align:center;font-size:18px;font-weight:600;border-radius:0 0 18px 18px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:pd .35s ease-out}#pop small{display:block;font-size:12px;font-weight:400;opacity:.9;margin-top:4px}@keyframes pd{from{transform:translateY(-100%)}to{transform:none}}
.new{border-left:5px solid #e67e22}.preparing{border-left:5px solid #2980b9}.ready{border-left:5px solid #27ae60}.c{text-align:center;padding:40px}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const FB={apiKey:"AIzaSyDxaTvDs3QpZX3BiDqbgub3Y1jwiW9huLA",authDomain:"the-muggly-cafe-1c060.firebaseapp.com",projectId:"the-muggly-cafe-1c060",appId:"1:206301518238:web:3b69d187c52d8a81a7de8f"};
const SEED={"name":"The Muggly Cafe","categories":[{"name":"Maggi","items":[{"name":"Veg Maggi","price":79,"available":true},{"name":"Double Masala Maggi","price":79,"available":true},{"name":"Cheese Maggi","price":89,"available":true},{"name":"Butter Maggi","price":89,"available":true},{"name":"Paneer Tikka Maggi","price":99,"available":true}]},{"name":"Sandwich","items":[{"name":"Veg Sandwich","price":99,"available":true},{"name":"Cheese Sandwich","price":109,"available":true},{"name":"Veg Grilled Sandwich","price":109,"available":true},{"name":"Paneer Tikka Sandwich","price":129,"available":true},{"name":"Peri Peri Sandwich","price":139,"available":true}]},{"name":"Burger","items":[{"name":"Veg Burger","price":89,"available":true},{"name":"Cheese Burger","price":109,"available":true},{"name":"Double Cheese Burger","price":139,"available":true},{"name":"Rambow Burger","price":139,"available":true},{"name":"Peri Peri Burger","price":149,"available":true},{"name":"Paneer Burger","price":149,"available":true},{"name":"Peri Peri Paneer Burger","price":159,"available":true}]},{"name":"Pizza","items":[{"name":"Cheese Pizza","price":119,"available":true},{"name":"Cheese Corn Pizza","price":129,"available":true},{"name":"Veg Pizza","price":149,"available":true},{"name":"Onion Pizza","price":149,"available":true},{"name":"Tomato Pizza","price":149,"available":true},{"name":"Capsicum Pizza","price":149,"available":true},{"name":"Mushroom Pizza","price":159,"available":true},{"name":"Paneer Tikka Pizza","price":169,"available":true},{"name":"Farm House Pizza","price":179,"available":true},{"name":"Mexican Pizza","price":249,"available":true}]},{"name":"Pasta","items":[{"name":"White Sauce Pasta","price":null,"available":true},{"name":"Red Sauce Pasta","price":null,"available":true},{"name":"Pink Sauce Pasta","price":null,"available":true},{"name":"Cheese Pasta","price":null,"available":true},{"name":"Tandoori Pasta","price":169,"available":true}]},{"name":"Mojito","items":[{"name":"Green Mint Mojito","price":99,"available":true},{"name":"BlueBerry Mojito","price":99,"available":true},{"name":"Orange Plus Mojito","price":99,"available":true},{"name":"Watermelon Mojito","price":99,"available":true},{"name":"Virgin Mojito","price":99,"available":true}]},{"name":"Tea & Coffee","items":[{"name":"Tea","price":19,"available":true},{"name":"Hot Coffee","price":29,"available":true},{"name":"Chocolate Chai","price":29,"available":true},{"name":"Black Tea","price":39,"available":true},{"name":"Black Coffee","price":49,"available":true},{"name":"Lemon Water","price":49,"available":true},{"name":"Lemon Ice Tea","price":89,"available":true},{"name":"Cold Coffee","price":89,"available":true}]},{"name":"Shakes","items":[{"name":"Mango Shake","price":149,"available":true},{"name":"Strawberry Shake","price":149,"available":true},{"name":"Pineapple Shake","price":149,"available":true},{"name":"Chocolate Shake","price":149,"available":true},{"name":"Kit-Kat Shake","price":149,"available":true},{"name":"Oreo Shake","price":149,"available":true},{"name":"Butter Scotch Shake","price":149,"available":true}]},{"name":"Protein Shake","items":[{"name":"Chocolate Protein Shake","price":199,"available":true},{"name":"Vanilla Protein Shake","price":199,"available":true},{"name":"Banana Protein Shake","price":199,"available":true},{"name":"Peanut Butter Protein Shake","price":null,"available":true},{"name":"Coffee Protein Shake","price":null,"available":true}]},{"name":"Noodles","items":[{"name":"Veg Noodles","price":99,"available":true},{"name":"Singapuri Noodles","price":129,"available":true},{"name":"Hakka Noodles","price":129,"available":true},{"name":"Chilli Hakka Noodles","price":129,"available":true}]},{"name":"Momos","items":[{"name":"Veg Momos","price":69,"available":true},{"name":"Paneer Momos","price":99,"available":true},{"name":"Veg Gravy Momos","price":99,"available":true},{"name":"Veg Kurkure Momos","price":99,"available":true},{"name":"Cheese Corn Momos","price":119,"available":true},{"name":"Paneer Gravy Momos","price":129,"available":true},{"name":"Paneer Kurkure Momos","price":129,"available":true},{"name":"Cheese Corn Gravy Momos","price":149,"available":true},{"name":"Cheese Corn Kurkure Momos","price":149,"available":true}]},{"name":"Manchurian","items":[{"name":"Veg Manchurian Dry","price":139,"available":true},{"name":"Veg Manchurian Gravy","price":149,"available":true},{"name":"Mushroom Manchurian Dry","price":159,"available":true},{"name":"Mushroom Manchurian Gravy","price":169,"available":true},{"name":"Chilli Paneer Dry","price":169,"available":true},{"name":"Chilli Paneer Gravy","price":179,"available":true}]},{"name":"Fry Rice","items":[{"name":"Veg Fry Rice","price":99,"available":true},{"name":"Singapuri Fry Rice","price":129,"available":true},{"name":"Chilli Garlic Fry Rice","price":129,"available":true}]},{"name":"Fries","items":[{"name":"French Fries","price":69,"available":true},{"name":"Peri French Fries","price":89,"available":true},{"name":"Chilli Potato","price":119,"available":true},{"name":"Honey Chilli Potato","price":139,"available":true}]},{"name":"Roll & Garlic Bread","items":[{"name":"Garlic Bread","price":49,"available":true},{"name":"Veg Roll","price":79,"available":true},{"name":"Spring Roll","price":79,"available":true},{"name":"Paneer Roll","price":99,"available":true},{"name":"Cheese Garlic Bread","price":99,"available":true},{"name":"Cheese Roll","price":119,"available":true},{"name":"Mexican Roll","price":149,"available":true}]},{"name":"Snacks","items":[{"name":"Bhel Puri","price":69,"available":true}]}]};
firebase.initializeApp(FB);const db=firebase.firestore(),auth=firebase.auth();
const Q=new URLSearchParams(location.search),cafe=Q.get('cafe')||'the-muggly-cafe',view=Q.get('view');
const $=s=>document.querySelector(s),app=$('#app');
const menuRef=db.doc(`cafes/${cafe}/menu/main`),orders=db.collection(`cafes/${cafe}/orders`);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LBL={new:'New',preparing:'Preparing',ready:'Ready',served:'Served'},NEXT={new:'preparing',preparing:'ready',ready:'served'};

function customer(){
 let menu,cart={},table=Q.get('table')||'';
 const lines=()=>{const r=[];menu.categories.forEach((c,ci)=>c.items.forEach((it,ii)=>{const n=cart[ci+'-'+ii];if(n)r.push({name:it.name,price:it.price,qty:n})}));return r};
 const total=()=>lines().reduce((a,l)=>a+l.price*l.qty,0);
 const bar=()=>{const n=lines().reduce((a,l)=>a+l.qty,0);$('#bar').innerHTML=n?`<button id=view>View order · ${n} items · ₹${total()}</button>`:''};
 function render(){
  document.title=menu.name;
  app.innerHTML=`<header><h1>${esc(menu.name)}</h1><small>Come for the food, stay for the mood</small><small style="margin-top:8px">${table?'Table '+esc(table):'Dine-in'}</small></header><nav class=chips>${menu.categories.map((c,ci)=>`<a href="#c${ci}">${esc(c.name)}</a>`).join('')}</nav>`+menu.categories.map((c,ci)=>`<h2 id="c${ci}">${esc(c.name)}</h2>`+c.items.map((it,ii)=>{const k=ci+'-'+ii,ok=it.available&&it.price!=null;return `<div class="it ${ok?'':'off'}"><div><b><span class=v></span>${esc(it.name)}</b><br>${it.price==null?'Ask staff':'₹'+it.price}</div>${ok?`<div class=q><button data-k="${k}" data-d="-1">−</button><span id="q${k}">${cart[k]||0}</span><button data-k="${k}" data-d="1">+</button></div>`:'<i>Unavailable</i>'}</div>`}).join('')).join('')+'<div id=bar></div>';bar();
 }
 function sheet(){
  app.innerHTML=`<header><h1>Your order</h1></header>`+lines().map(l=>`<div class=it><span>${esc(l.name)} × ${l.qty}</span><b>₹${l.price*l.qty}</b></div>`).join('')+`<div class=p><h3>Total ₹${total()}</h3>${table?'':'<input id=tb placeholder="Table number">'}<button id=place style="width:100%;padding:14px">Place order</button><br><br><button class=g id=back style="width:100%">Back to menu</button></div>`;
 }
 function track(id){
  orders.doc(id).onSnapshot(s=>{const o=s.data();if(!o)return;app.innerHTML=`<header><h1>${esc(menu.name)}</h1></header><div class=c><h2>Order status</h2><h1>${LBL[o.status]}</h1><p>Table ${esc(o.table)} · ₹${o.total}</p>${o.status=='served'?'<button id=again>Order more</button>':'<p>Updates live. Please keep this page open.</p>'}</div>`});
 }
 app.onclick=async e=>{const t=e.target;
  if(t.dataset.k){const k=t.dataset.k,n=Math.max(0,(cart[k]||0)+ +t.dataset.d);cart[k]=n;$('#q'+k).textContent=n;bar()}
  else if(t.id=='view')sheet();else if(t.id=='back'||t.id=='again'){if(t.id=='again')cart={};render()}
  else if(t.id=='place'){if(!table)table=($('#tb')||{}).value||'';if(!table.trim())return alert('Enter table number');t.disabled=true;
   try{const r=await orders.add({table:table.trim(),items:lines(),total:total(),status:'new',ts:firebase.firestore.FieldValue.serverTimestamp()});cart={};track(r.id)}catch(x){alert('Could not place order. Try again.');t.disabled=false}}
 };
 menuRef.onSnapshot(s=>{if(!s.exists){app.innerHTML='<p class=c>Menu not ready yet.</p>';return}menu=s.data();if(!$('#bar')&&app.querySelector('.c'))return;if(app.querySelector('#place'))return;render()});
}

function kitchen(){
 app.innerHTML='<header><h1>Kitchen login</h1></header><form class=p id=lf><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Password><button style="width:100%;padding:14px">Login</button><p id=err></p></form>';
 $('#lf').onsubmit=e=>{e.preventDefault();auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(x=>$('#err').textContent=x.message)};
 let started=false;
 auth.onAuthStateChanged(u=>{if(u&&!started){started=true;panel()}});
}
function panel(){
 const save=()=>menuRef.set(menu);
 let tab='o',list=[],menu=null,hist=[],days=1,hu=null,rg=null,fv='',tv='';
 let ac=null,wl=null,pc=0,pt=null;
 const wake=async()=>{if(!('wakeLock' in navigator)||wl)return;try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}};
 const unlock=()=>{try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();ac.onstatechange=()=>draw()}if(ac.state!='running')ac.resume()}catch(e){}wake()};
 document.addEventListener('click',unlock);document.addEventListener('touchstart',unlock);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();if(ac&&ac.state!='running')ac.resume()}});
 const tone=(f,t0,dur)=>{const g=ac.createGain(),g2=ac.createGain(),o=ac.createOscillator(),o2=ac.createOscillator();o.type=o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.76;g2.gain.value=.35;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.75,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);o2.connect(g2);g2.connect(g);g.connect(ac.destination);o.start(t0);o2.start(t0);o.stop(t0+dur);o2.stop(t0+dur)};
 const ding=()=>{if(!ac||ac.state!='running')return;const n=ac.currentTime;[0,1.5].forEach(o=>{tone(988,n+o,1.1);tone(740,n+o+.45,1.3)})};
 const popup=o=>{pc++;let p=$('#pop');if(!p){p=document.createElement('div');p.id='pop';p.onclick=()=>{p.remove();pc=0};document.body.appendChild(p)}p.innerHTML=`🔔 Naya order · Table ${esc(o.table)} · ₹${o.total}${pc>1?`<small>+${pc-1} aur naye orders</small>`:''}<small>Tap to close</small>`;clearTimeout(pt);pt=setTimeout(()=>{p.remove();pc=0},10000)};
 const notify=o=>{ding();popup(o);if(navigator.vibrate)navigator.vibrate([300,150,300])};
 const loadH=()=>{hu&&hu();const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(days-1));hu=(rg?orders.where('ts','>=',rg[0]).where('ts','<=',rg[1]):orders.where('ts','>=',d)).orderBy('ts','desc').onSnapshot(s=>{hist=s.docs.map(x=>({id:x.id,...x.data()}));if(tab=='h')draw()})};
 const histHtml=()=>{const byD={};hist.forEach(o=>{if(!o.ts)return;const k=o.ts.toDate().toLocaleDateString('en-CA');(byD[k]=byD[k]||{n:0,t:0});byD[k].n++;byD[k].t+=o.total||0});
  const dayRows=Object.keys(byD).sort().reverse().map(k=>`<div class=it><span>${new Date(k+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span>${byD[k].n} orders · <b>₹${byD[k].t}</b></span></div>`).join('');
  const T=hist.reduce((a,o)=>a+(o.total||0),0),c={};hist.forEach(o=>o.items.forEach(i=>c[i.name]=(c[i.name]||0)+i.qty));const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class=tabs>${[[1,'Today'],[7,'7 days'],[30,'30 days']].map(([n,l])=>`<button data-r=${n} class="${!rg&&days==n?'':'g'}">${l}</button>`).join('')}</div><div class=p style="display:flex;gap:6px"><input type=date id=f value="${fv}" style="flex:1;min-width:0"><input type=date id=t2 value="${tv}" style="flex:1;min-width:0"><button data-go=1>Show</button></div><div class=card style="background:linear-gradient(160deg,#143526,#1f4d3a);color:#e8c977;text-align:center"><small>Total sale</small><div style="font-size:36px;font-weight:600">₹${T}</div>${hist.length} orders${hist.length?' · avg ₹'+Math.round(T/hist.length):''}</div><h2>Date wise sale</h2>${dayRows||'<p class=c>No orders</p>'}<div class=card><small>Top: ${top.map(t=>esc(t[0])+' ×'+t[1]).join(', ')||'-'}</small></div>`+hist.map(o=>`<div class=card><b>Table ${esc(o.table)}</b> · ₹${o.total} · ${LBL[o.status]}<br><small>${o.ts?o.ts.toDate().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''}</small><br>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</div>`).join('')};
 const draw=()=>{
  let h=`<header><h1>${menu?esc(menu.name):'Kitchen'}</h1></header><div class=tabs><button data-t=o class="${tab=='o'?'':'g'}">Orders</button><button data-t=m class="${tab=='m'?'':'g'}">Menu</button><button data-t=h class="${tab=='h'?'':'g'}">History</button><button class=g id=out>Logout</button>${ac&&ac.state=='running'?'<button class=g id=snd>🔊 Sound ON</button><button class=g id=tst>Test sound</button>':'<button id=snd style="background:#c0392b">🔇 Tap to enable sound</button>'}</div>`;
  if(tab=='o'){const a=list.filter(o=>o.status!='served').reverse();h+=`<div class=card><b>Today's sale ₹${tod.t}</b> · ${tod.n} orders</div>`;h+=a.length?a.map(o=>`<div class="card ${o.status}"><b>Table ${esc(o.table)}</b> · ₹${o.total} · ${LBL[o.status]}<br>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}<br><br><button data-id="${o.id}" data-s="${NEXT[o.status]}">Mark ${LBL[NEXT[o.status]]}</button></div>`).join(''):'<p class=c>No active orders</p>'}
  else if(tab=='h')h+=histHtml();
  else if(!menu)h+='<div class=c><button id=seed>Load The Muggly Cafe menu</button></div>';
  else h+=`<div class=p><button data-ac=1>+ Add category</button></div>`+menu.categories.map((c,ci)=>`<div class=mh><h2>${esc(c.name)}</h2><span><button class=g data-rc="${ci}">Rename</button> <button class=g data-dc="${ci}">Delete</button></span></div>`+c.items.map((it,ii)=>`<div class=it><div><b>${esc(it.name)}</b><br>${it.price==null?'no price':'₹'+it.price}</div><div class=q><button data-a="${ci}-${ii}" class="${it.available?'':'g'}">${it.available?'On':'Off'}</button><button class=g data-e="${ci}-${ii}">✎</button><button class=g data-x="${ci}-${ii}">✕</button></div></div>`).join('')+`<div class=p><button class=g data-ad="${ci}">+ Add dish</button></div>`).join('');
  app.innerHTML=h;
 };
 const d0=new Date();d0.setHours(0,0,0,0);let tod={n:0,t:0};orders.where('ts','>=',d0).onSnapshot(s=>{tod={n:s.size,t:s.docs.reduce((a,x)=>a+(x.data().total||0),0)};if(tab=='o')draw()});
 let first=true;
 orders.orderBy('ts','desc').limit(60).onSnapshot(s=>{list=s.docs.map(d=>({id:d.id,...d.data()}));if(!first)s.docChanges().forEach(c=>{if(c.type=='added'&&!c.doc.metadata.hasPendingWrites&&c.doc.data().status=='new')notify(c.doc.data())});first=false;if(tab=='o')draw()});
 menuRef.onSnapshot(s=>{menu=s.exists?s.data():null;draw()});
 app.onclick=async e=>{const t=e.target,d=t.dataset;
  if(t.id=='tst')ding();
  else if(d.t){tab=d.t;if(tab=='h')loadH();draw()}else if(d.r){days=+d.r;rg=null;fv=tv='';loadH();draw()}else if(d.go){const f=$('#f').value,t=$('#t2').value;if(!f||!t||f>t)return alert('Select From and To dates correctly');rg=[new Date(f+'T00:00:00'),new Date(t+'T23:59:59.999')];fv=f;tv=t;loadH();draw()}else if(t.id=='out'){location.reload();auth.signOut()}
  else if(d.id)orders.doc(d.id).update({status:d.s});
  else if(t.id=='seed')menuRef.set(SEED);
  else if(d.a){const[c,i]=d.a.split('-');menu.categories[c].items[i].available^=1;menu.categories[c].items[i].available=!!menu.categories[c].items[i].available;menuRef.set(menu)}
  else if(d.ac!==undefined){const n=prompt('Category name');if(n){menu.categories.push({name:n.trim(),items:[]});save()}}
  else if(d.rc!==undefined){const c=menu.categories[d.rc],n=prompt('Category name',c.name);if(n){c.name=n.trim();save()}}
  else if(d.dc!==undefined){if(confirm('Delete this whole category and its dishes?')){menu.categories.splice(d.dc,1);save()}}
  else if(d.ad!==undefined){const n=prompt('Dish name');if(!n)return;const p=+prompt('Price (₹)');if(!(p>0))return alert('Enter a valid price');menu.categories[d.ad].items.push({name:n.trim(),price:p,available:true});save()}
  else if(d.e){const[c,i]=d.e.split('-'),it=menu.categories[c].items[i],n=prompt('Dish name',it.name);if(!n)return;const p=+prompt('Price (₹)',it.price||'');if(!(p>0))return alert('Enter a valid price');it.name=n.trim();it.price=p;save()}
  else if(d.x){const[c,i]=d.x.split('-');if(confirm('Delete '+menu.categories[c].items[i].name+'?')){menu.categories[c].items.splice(i,1);save()}}
  else if(d.p){const[c,i]=d.p.split('-'),v=prompt('New price (₹)');if(v&&+v>0){menu.categories[c].items[i].price=+v;menuRef.set(menu)}}
 };
}
view=='kitchen'?kitchen():customer();
</script></body></html>
